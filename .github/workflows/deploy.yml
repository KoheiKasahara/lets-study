name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Pages デプロイに必要な最小限の権限
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: build & deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test

      - name: Build (for GitHub Pages)
        run: npm run build
        env:
          VITE_BASE: /lets-study/

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Write summary
        if: always()
        run: |
          {
            echo "## デプロイ サマリ"
            echo ""
            echo "- 結果: ${{ steps.deployment.outcome }}"
            echo "- 公開URL: ${{ steps.deployment.outputs.page_url }}"
            echo "- コミット: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
